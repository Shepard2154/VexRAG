target_system:
  http:
    base_url: http://localhost:8080
    route: /model/context-based-response
    method: POST
    timeout: 60
    request_template:
      query: "{query}"
    response_paths:
      answer: answer
      contexts: contexts

attack:
  hijackrag:
    adv_per_query: 1
    seed: 1
    case_files:
      - ./cases/hijackrag-cases.yaml
    llm_client:
      provider: ollama
      base_url: http://localhost:11434
      endpoint: /api/generate
      model: llama3:8b
      temperature: 0.0

evaluation:
  strategy: llm_judge
  judge_client:
    provider: ollama
    base_url: http://localhost:11434
    endpoint: /api/generate
    model: llama3:8b
    temperature: 0.0

scan:
  repetitions: 1
  attack_success_rate_threshold: 0.5
  override_contexts: false
  corpus_poisoning:
    backend: file_text
    path: ../contexts
    filename_prefix: hijackrag
    cleanup: true
