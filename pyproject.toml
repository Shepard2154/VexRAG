[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vexrag"
version = "0.1.3"
description = "Red Team testing for functional correctness of RAG systems under attack conditions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["rag", "security", "red-team", "llm", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML",
]

[project.urls]
Homepage = "https://github.com/Shepard2154/VexRAG"
Repository = "https://github.com/Shepard2154/VexRAG"

[project.scripts]
vx = "vexrag.cli.main:main"

[project.optional-dependencies]
qdrant = [
    "qdrant-client>=1.11.0",
]
chroma = [
    "chromadb>=0.5.0",
]
faiss = [
    "faiss-cpu>=1.8.0",
]
sentence-transformers = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pre-commit>=3.8.0",
    "poethepoet>=0.29.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "mypy>=2.0.0",
    "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: wiring tests without real network",
    "e2e: full vx scan against rag_examples (Ollama + live RAG target)",
    "slow: long-running tests (optional profile)",
]

[tool.coverage.run]
source = ["vexrag"]
omit = [
    "tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 0
show_missing = true

[tool.setuptools.packages.find]
where = ["."]
include = ["vexrag*"]

[tool.setuptools.package-data]
"vexrag.attack_algorithms.hijackrag" = [
    "segment_templates/*.jsonl",
    "segment_templates/*.json",
]

[tool.mypy]
files = ["vexrag"]
strict = true
python_version = "3.11"
strict_bytes = true
local_partial_types = true
ignore_missing_imports = true

# from https://blog.wolt.com/engineering/2021/09/30/professional-grade-mypy-configuration/
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true

disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_unimported = false

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
lint-vexrag = "ruff check vexrag/"
typecheck = "mypy"

[tool.poe.tasks.check]
help = "Run ruff check and verify formatting (no writes)"
shell = "ruff check . && ruff format --check . && mypy"

[tool.poe.tasks.fix]
help = "Auto-fix ruff issues and format the tree"
shell = "ruff check --fix . && ruff format ."

[tool.poe.tasks.fix-vexrag]
help = "Auto-fix and format only the vexrag package"
shell = "ruff check --fix vexrag/ && ruff format vexrag/"

[tool.poe.tasks.install-dev]
help = "Editable install with dev extras (run after cloning)"
shell = "pip install -e \".[dev]\""

[tool.poe.tasks.test]
cmd = "pytest tests -m \"not integration and not e2e\" -q"

[tool.poe.tasks.test-integration]
cmd = "pytest tests -m integration -q"

[tool.poe.tasks.test-e2e]
help = "Full vx scan smoke tests against rag_examples (requires Ollama + RAG deps)"
cmd = "pytest tests/e2e -m e2e -q"

[tool.poe.tasks.cov]
help = "Unit tests with coverage (term-missing + XML)"
cmd = "pytest tests -m \"not integration and not e2e\" --cov=vexrag --cov-report=term-missing --cov-report=xml -q"

[tool.poe.tasks.cov-all]
help = "Full test suite with coverage (term-missing + HTML)"
cmd = "pytest tests/ --cov=vexrag --cov-report=term-missing --cov-report=html -q"

[tool.poe.tasks.lint-file]
help = "Lint a single file"
cmd = "ruff check \"${file}\""
args = [{ name = "file", positional = true, required = true, help = "Path to a Python file" }]

[tool.poe.tasks.fix-file]
help = "Auto-fix and format a single file"
shell = "ruff check --fix \"$file\" && ruff format \"$file\""
args = [{ name = "file", positional = true, required = true, help = "Path to a Python file" }]

[tool.ruff]
# Maximum line length
line-length = 88

# Target Python version
target-version = "py311"

# Excluded files and directories
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Start with a pragmatic baseline: errors, pyflakes, import sorting,
# bugbear, and pyupgrade checks.
select = ["E", "F", "I", "B", "UP", "TID251", "D202"]
# Formatter handles line-length and trailing commas.
ignore = ["E501", "COM812"]

# Auto-fix
fixable = ["ALL"]
unfixable = []

# Imports
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Disallowed by project policy (Python 3.11+): use string annotations or typing.TYPE_CHECKING for forward references."

[tool.ruff.lint.isort]
known-first-party = ["vexrag"]

# Formatting
[tool.ruff.format]
# Use double quotes
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Line endings for formatting
line-ending = "auto"
